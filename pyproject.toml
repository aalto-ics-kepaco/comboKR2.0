[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comboKR2"
version = "0.0.1"
authors = [
  { name="Riikka Huusari", email="riikka.huusari@aalto.fi" },
]
description = "ComboKR2.0 for predicting drug response surfaces"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.26.4", "scikit-learn>=1.5.2", "scipy>=1.13.1", "pytorch>=2.4.1", "RLScore @ https://github.com/aatapa/RLScore", "synergy==0.5.1"]

[project.urls]
Homepage = "https://github.com/aalto-ics-kepaco/comboKR2.0"
